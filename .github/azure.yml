trigger:
- main


pool:
  name: 'Validation Agent'

variables:
  NODE_VERSION: '18.x'

steps:
#  Install Node.js
- task: NodeTool@0
  inputs:
    versionSpec: $(NODE_VERSION)
  displayName: 'Install Node.js'

#  Install dependencies
- script: npm ci
  displayName: 'Install dependencies'

#  Install Playwright browsers
- script: npx playwright install chromium --with-deps
  displayName: 'Install Playwright Browsers'

#  Install Snyk CLI
- script: npm install -g snyk
  displayName: 'Install Snyk CLI'

#  Authenticate Snyk
- script: snyk auth $(SNYK_TOKEN)
  displayName: 'Authenticate Snyk'

#  Run Snyk test (fail build if vulnerabilities found)
- script: snyk test
  displayName: 'Run Snyk Security Scan'

# (Optional) Monitor project in Snyk dashboard
- script: snyk monitor
  displayName: 'Monitor Project in Snyk'
  condition: always()

#  Run Playwright tests
- script: npm test
  displayName: 'Run Playwright Tests'

#  Run OWASP ZAP Scan using Docker
- script: |
    docker run --rm -v $(System.DefaultWorkingDirectory):/zap/wrk/:rw \
      ghcr.io/zaproxy/zaproxy:stable zap-full-scan.py \
      -t https://the-internet.herokuapp.com/ \
      -r zap-report.html
  displayName: 'Run OWASP ZAP Scan'

#  Publish ZAP report as artifact
- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: 'zap-report.html'
    ArtifactName: 'ZAP-Report'
    publishLocation: 'Container'
  displayName: 'Publish ZAP Report'